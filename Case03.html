<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Case03</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <link rel="stylesheet" href="assets/lib/normalize.css">

    <style>

        section{
            height: 600px;
            width: 1000px;
            border: limegreen solid 5px;
            overflow: hidden;
        }

        div{
            height: 100px;
            aspect-ratio: 2/1;
            border-radius: 20px;
            background-color: yellow;
            animation-name: move;
            animation-iteration-count: infinite;
            animation-duration: 5s;
            animation-direction: alternate;
            transform: rotate(0deg);
        }

        @keyframes move {
            0% {
                margin-left: 0;
                margin-top: 0;
                background-color: blue;
                transform: rotate(360deg);
            }
            25% {
                margin-left: 800px;
                margin-top: 0;
                background-color: purple;
                transform: rotate(540deg);
            }
            50%{
                margin-left: 800px;
                margin-top: 500px;
                background-color: red;
                transform: rotate(360deg);
            }
            75% {
                margin-left: 0;
                margin-top: 500px;
                background-color: yellow;
                transform: rotate(180deg);
            }
        }

    </style>

</head>
<body>

<header>

    <section>
        <div></div>
    </section>

</header>

</body>
</html>
