<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Case01</title>

    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <link rel="stylesheet" href="assets/lib/normalize.css">
    <link rel="stylesheet" href="https://www.hxstrive.com/cdn/libs/font-awesome/7.0.1/css/all.min.css">

    <style>
        section > div{
            height: 60px;
            width: 250px;
            display: flex;
            align-items: center;
            margin: 15px 0;
            padding-left: 15px;
            border-radius: 5px;

            background-color: mediumpurple;
            box-shadow: 6px 8px 6px #727272;

            position: relative;
            left: -200px;

            color: white;
            font-family: cursive;
            font-weight: bold;
            transition-duration: 2s;
        }

        section > div:hover{
            left: 10px;
        }

        section > div > i{
            font-size: 25px;
            position: absolute;
            right: 15px;
        }

    </style>

</head>

<body>

<section>
    <div>Menu One   <i class="fa-solid fa-address-book" style="color: rgb(255, 255, 255);"></i>     </div>
    <div>Menu Two   <i class="fa-solid fa-truck-medical" style="color: rgb(255, 255, 255);"></i>    </div>
    <div>Menu Three <i class="fa-solid fa-book-atlas" style="color: rgb(255, 255, 255);"></i>       </div>
    <div>Menu Four  <i class="fa-solid fa-layer-group" style="color: rgb(255, 255, 255);"></i>      </div>
    <div>Menu Five  <i class="fa-solid fa-cart-arrow-down" style="color: rgb(255, 255, 255);"></i>  </div>
</section>

</body>
</html>
